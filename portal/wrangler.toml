name = "foxvox-portal"
main = "src/index.mjs"
compatibility_date = "2026-08-01"
workers_dev = true
# The whole brand domain is served by this worker (site + signup + account +
# policies). The worker route shadows the old Pages landing; remove the route to
# restore it. URLs cited by the 10DLC campaign (foxvox-a2p/config/campaign.json):
# opt-in at /signup, privacy at /privacy, terms at /terms — keep them stable.
routes = [
  { pattern = "foxvox.ai/*", zone_name = "foxvox.ai" },
]


# Billing data only. This worker has NO binding to the messaging content
# database (securus-agent-db) — by construction it cannot read message content.
[[d1_databases]]
binding = "BILLING"
database_name = "foxvox-billing-db"
database_id = "a4aac043-9c42-4287-aa42-86080e9c83d3"

# Secrets (set via dashboard or `wrangler secret put --name foxvox-portal`):
#   STRIPE_SECRET_KEY   — restricted key from the FoxVox Stripe account
#   ADMIN_TOKEN         — gate for admin/verify endpoints
#   STRIPE_WEBHOOK_SECRET — from /stripe/setup-webhook (or Stripe dashboard)
#   SESSION_SECRET      — random 32+ chars; signs the /account cookie
